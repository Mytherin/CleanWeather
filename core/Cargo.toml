[package]
name = "cleanweather-core"
version = "0.1.0"
edition = "2024"
description = "KNMI radar download, decoding and rain nowcasting, shared by the desktop and iPhone apps"

[dependencies]
anyhow = "1"
chrono = "0.4"
hdf5-reader = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
